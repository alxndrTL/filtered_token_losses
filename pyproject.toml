[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ftl"
version = "0.1.0"
description = "Filtered token losses: measurement-only recall/state diagnostics for LLM architecture research (arXiv:2606.20936 + extensions)"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["ftl"]
